services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  web:
    image: ghcr.io/mattcoleanderson/ynab-notifier:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - redis

  celery-worker:
    image: ghcr.io/mattcoleanderson/ynab-notifier:latest
    restart: unless-stopped
    command: uv run celery -A config worker --loglevel=info
    env_file: .env
    depends_on:
      - redis

  celery-beat:
    image: ghcr.io/mattcoleanderson/ynab-notifier:latest
    restart: unless-stopped
    command: uv run celery -A config beat --loglevel=info
    env_file: .env
    depends_on:
      - redis
